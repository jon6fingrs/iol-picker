# Copies the lens picker rules from jonathankatzmd.com, the one source of
# truth (README, "Shared engine"), into site/js/iolpicker-rules.js. If the
# file changed and this site's tests pass on it, the copy is committed to
# main and the site is republished; if the tests fail, nothing changes and
# this run shows as failed. Runs daily, or from the Actions tab ("Run
# workflow") right after changing the rules on the website.
name: Sync engine

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-engine
  cancel-in-progress: false

env:
  SRC_REPO: jon6fingrs/jonathankatzmd-zola
  SRC_BRANCH: master
  SRC_PATH: static/js/iolpicker-rules.js
  DEST_PATH: site/js/iolpicker-rules.js

jobs:
  sync:
    name: Copy the rules from the website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Take the file as of the last website commit that changed it, so the
      # copy and the commit message name the same version.
      - name: Fetch the rules
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/$SRC_REPO/commits?sha=$SRC_BRANCH&path=$SRC_PATH&per_page=1" --jq '.[0].sha')
          test -n "$sha"
          curl -fsSL "https://raw.githubusercontent.com/$SRC_REPO/$sha/$SRC_PATH" -o "$DEST_PATH"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- "$DEST_PATH"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date with $SRC_REPO@${sha:0:7}."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- "$DEST_PATH"
          fi

      - name: Run this site's tests on the new rules
        if: steps.fetch.outputs.changed == 'true'
        run: node --test 'tests/*.test.js'

      # A push made with the workflow's own token does not start other
      # workflows, so the deploy (ci.yml) is started directly.
      - name: Commit and republish
        if: steps.fetch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.fetch.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST_PATH"
          git commit -m "Sync lens picker rules from jonathankatzmd-zola@${SHA:0:7}" -m "https://github.com/$SRC_REPO/commit/$SHA"
          git push origin HEAD:main
          gh workflow run ci.yml --ref main
